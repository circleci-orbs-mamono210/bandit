---
description: >
  CircleCI Python executor for running Bandit. This executor does not
  include Bandit, so run bandit/install before bandit/execute.
docker:
  - image: '<<parameters.image>>'
parameters:
  image:
    default: cimg/python:3.14
    type: string
  resource_class:
    default: small
    enum: ["small", "medium", "medium+", "large"]
    type: enum
resource_class: '<<parameters.resource_class>>'
