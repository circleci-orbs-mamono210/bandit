version: 2.1

orbs:
  bandit: orbss/bandit@dev:<<pipeline.git.revision>>
  orb-tools: circleci/orb-tools@11.1

filters: &filters
  tags:
    only: /.*/

jobs:
  command-tests:
    executor: bandit/default
    steps:
      - checkout

      - bandit/install:
          extras: toml
          version: "1.9.4"

      # Scan the committed clean fixture directly.
      - bandit/execute:
          recursive: false
          targets: tests/clean/main.py

  parameter-tests:
    executor: bandit/default
    steps:
      - checkout

      - bandit/install:
          extras: toml
          version: "1.9.4"

      # Generate a JSON report from the committed insecure fixture.
      - bandit/execute:
          exit-zero: true
          format: json
          output-file: reports/bandit.json
          recursive: false
          targets: tests/insecure/main.py

      - run:
          name: Verify Bandit JSON report
          command: |
            set -euo pipefail

            test -s reports/bandit.json

            echo "Bandit JSON report:"
            cat reports/bandit.json

            python - \<<'PY'
            import json
            from pathlib import Path

            report_path = Path("reports/bandit.json")
            report = json.loads(
                report_path.read_text(encoding="utf-8")
            )

            errors = report.get("errors", [])
            if errors:
                raise SystemExit(
                    f"Bandit reported scan errors: {errors}"
                )

            metrics = report.get("metrics", {})
            totals = metrics.get("_totals", {})
            scanned_lines = totals.get("loc", 0)

            if scanned_lines == 0:
                raise SystemExit(
                    "Bandit did not scan any Python source lines. "
                    f"metrics={metrics}"
                )

            results = report.get("results", [])
            if not results:
                raise SystemExit(
                    "Expected at least one Bandit finding in "
                    "tests/insecure/main.py"
                )

            test_ids = {
                result.get("test_id")
                for result in results
                if result.get("test_id")
            }

            if "B324" not in test_ids:
                raise SystemExit(
                    "Expected B324 in Bandit findings, "
                    f"but detected: {sorted(test_ids)}"
                )

            filenames = {
                result.get("filename")
                for result in results
                if result.get("filename")
            }

            print(f"Scanned source lines: {scanned_lines}")
            print(f"Verified {len(results)} finding(s)")
            print(f"Detected test IDs: {sorted(test_ids)}")
            print(f"Scanned files: {sorted(filenames)}")
            PY

      # Verify that findings already present in the baseline are ignored.
      - bandit/execute:
          baseline: reports/bandit.json
          recursive: false
          targets: tests/insecure/main.py

      - store_artifacts:
          path: reports

      # Verify that B324 can be skipped.
      # B324 is the only HIGH severity finding in the fixture.
      - bandit/execute:
          recursive: false
          severity-level: high
          skips: B324
          targets: tests/insecure/main.py

      # Verify that config-file loads the committed Bandit configuration.
      # The config skips B324, which is the only HIGH severity finding.
      - bandit/execute:
          config-file: tests/config/bandit.yaml
          recursive: false
          severity-level: high
          targets: tests/insecure/main.py

      # Verify that ini-path loads the committed Bandit INI configuration.
      # The INI file skips B324, which is the only HIGH severity finding.
      - bandit/execute:
          ini-path: tests/config/.bandit
          recursive: false
          severity-level: high
          targets: tests/insecure/main.py

      # Verify that confidence-level filters lower-confidence findings.
      # B104 is MEDIUM severity / MEDIUM confidence.
      # B324 is skipped and B101 is below the MEDIUM severity threshold.
      - bandit/execute:
          confidence-level: high
          recursive: false
          severity-level: medium
          skips: B324
          targets: tests/insecure/main.py

      # Verify that extra-args forwards multiple Bandit CLI arguments.
      # B324 is the only HIGH severity finding, so this should exit 0.
      - bandit/execute:
          extra-args: "--severity-level high --skip B324"
          recursive: false
          targets: tests/insecure/main.py

      # Verify directory scanning and excluded-paths independently.
      - bandit/execute:
          excluded-paths: tests/insecure
          targets: tests

  install-tests:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout

      - bandit/install:
          extras: toml
          version: "1.9.4"

      - bandit/execute:
          recursive: false
          targets: tests/clean/main.py

  resource-class-test:
    executor:
      name: bandit/default
      resource_class: medium
    steps:
      - checkout

      - bandit/install:
          extras: toml
          version: "1.9.4"

      - bandit/execute:
          recursive: false
          targets: tests/clean/main.py

workflows:
  test-deploy:
    jobs:
      - command-tests:
          filters: *filters

      - parameter-tests:
          filters: *filters

      - install-tests:
          filters: *filters

      - resource-class-test:
          filters: *filters

      - orb-tools/pack:
          filters: *filters

      - orb-tools/publish:
          orb-name: orbss/bandit
          vcs-type: << pipeline.project.type >>
          pub-type: production
          requires:
            - orb-tools/pack
            - command-tests
            - install-tests
            - parameter-tests
            - resource-class-test
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
