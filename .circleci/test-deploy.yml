version: 2.1

orbs:
  bandit: orbss/bandit@dev:<<pipeline.git.revision>>
  orb-tools: circleci/orb-tools@11.1

filters: &filters
  tags:
    only: /.*/

jobs:
  command-tests:
    executor: bandit/default
    steps:
      - checkout

      - bandit/install:
          extras: toml
          version: "1.9.4"

      # Scan the committed clean fixture directly.
      - bandit/execute:
          recursive: false
          targets: tests/clean/main.py

  parameter-tests:
    executor: bandit/default
    steps:
      - checkout

      - bandit/install:
          extras: toml,sarif
          version: "1.9.4"

      # Generate a JSON report from the committed insecure fixture.
      - bandit/execute:
          exit-zero: true
          format: json
          output-file: reports/bandit.json
          recursive: false
          targets: tests/insecure/main.py

      - run:
          name: Verify Bandit JSON report
          command: |
            set -euo pipefail

            test -s reports/bandit.json

            echo "Bandit JSON report:"
            cat reports/bandit.json

            python - \<<'PY'
            import json
            from pathlib import Path

            report_path = Path("reports/bandit.json")
            report = json.loads(
                report_path.read_text(encoding="utf-8")
            )

            errors = report.get("errors", [])
            if errors:
                raise SystemExit(
                    f"Bandit reported scan errors: {errors}"
                )

            metrics = report.get("metrics", {})
            totals = metrics.get("_totals", {})
            scanned_lines = totals.get("loc", 0)

            if scanned_lines == 0:
                raise SystemExit(
                    "Bandit did not scan any Python source lines. "
                    f"metrics={metrics}"
                )

            results = report.get("results", [])
            if not results:
                raise SystemExit(
                    "Expected at least one Bandit finding in "
                    "tests/insecure/main.py"
                )

            test_ids = {
                result.get("test_id")
                for result in results
                if result.get("test_id")
            }

            if "B324" not in test_ids:
                raise SystemExit(
                    "Expected B324 in Bandit findings, "
                    f"but detected: {sorted(test_ids)}"
                )

            filenames = {
                result.get("filename")
                for result in results
                if result.get("filename")
            }

            print(f"Scanned source lines: {scanned_lines}")
            print(f"Verified {len(results)} finding(s)")
            print(f"Detected test IDs: {sorted(test_ids)}")
            print(f"Scanned files: {sorted(filenames)}")
            PY

      # Generate a SARIF report from the committed insecure fixture.
      - bandit/execute:
          exit-zero: true
          format: sarif
          output-file: reports/bandit.sarif
          recursive: false
          targets: tests/insecure/main.py

      - run:
          name: Verify Bandit SARIF report
          command: |
            set -euo pipefail

            test -s reports/bandit.sarif

            python - \<<'PY'
            import json
            from pathlib import Path

            report_path = Path("reports/bandit.sarif")
            report = json.loads(
                report_path.read_text(encoding="utf-8")
            )

            version = report.get("version")
            if version != "2.1.0":
                raise SystemExit(
                    "Expected SARIF version 2.1.0, "
                    f"but detected: {version!r}"
                )

            runs = report.get("runs", [])
            if not runs:
                raise SystemExit(
                    "Bandit SARIF report contains no runs"
                )

            driver = (
                runs[0]
                .get("tool", {})
                .get("driver", {})
            )

            if driver.get("name") != "Bandit":
                raise SystemExit(
                    "Expected SARIF tool driver 'Bandit', "
                    f"but detected: {driver!r}"
                )

            results = []
            for run in runs:
                results.extend(run.get("results") or [])

            if not results:
                raise SystemExit(
                    "Expected at least one Bandit finding "
                    "in the SARIF report"
                )

            rule_ids = {
                result.get("ruleId")
                for result in results
                if result.get("ruleId")
            }

            if "B324" not in rule_ids:
                raise SystemExit(
                    "Expected B324 in SARIF findings, "
                    f"but detected: {sorted(rule_ids)}"
                )

            print(f"SARIF version: {version}")
            print(
                "Bandit version: "
                f"{driver.get('version')}"
            )
            print(
                f"Verified {len(results)} SARIF finding(s)"
            )
            print(
                f"Detected rule IDs: {sorted(rule_ids)}"
            )
            PY

      # Verify that findings already present in the baseline are ignored.
      - bandit/execute:
          baseline: reports/bandit.json
          recursive: false
          targets: tests/insecure/main.py

      - store_artifacts:
          path: reports

      # Verify that B324 can be skipped.
      # B324 is the only HIGH severity finding in the fixture.
      - bandit/execute:
          recursive: false
          severity-level: high
          skips: B324
          targets: tests/insecure/main.py

      # Verify that config-file loads the committed Bandit configuration.
      # The config skips B324, which is the only HIGH severity finding.
      - bandit/execute:
          config-file: tests/config/bandit.yaml
          recursive: false
          severity-level: high
          targets: tests/insecure/main.py

      # Verify that ini-path loads the committed Bandit INI configuration.
      # The INI file skips B324, which is the only HIGH severity finding.
      - bandit/execute:
          ini-path: tests/config/.bandit
          recursive: false
          severity-level: high
          targets: tests/insecure/main.py

      # Verify that confidence-level filters lower-confidence findings.
      # B104 is MEDIUM severity / MEDIUM confidence.
      # B324 is skipped and B101 is below the MEDIUM severity threshold.
      - bandit/execute:
          confidence-level: high
          recursive: false
          severity-level: medium
          skips: B324
          targets: tests/insecure/main.py

      # Verify that extra-args forwards multiple Bandit CLI arguments.
      # B324 is the only HIGH severity finding, so this should exit 0.
      - bandit/execute:
          extra-args: "--severity-level high --skip B324"
          recursive: false
          targets: tests/insecure/main.py

      # Verify that multiline extra-args treats newlines as whitespace.
      # If only the first line is processed, B324 causes the step to fail.
      - bandit/execute:
          extra-args: |
            --severity-level high
            --skip B324
          recursive: false
          targets: tests/insecure/main.py

      # Verify that targets forwards multiple paths independently.
      # B324 is skipped, so scanning both files should exit 0.
      - bandit/execute:
          recursive: false
          severity-level: high
          skips: B324
          targets: "tests/clean/main.py tests/insecure/main.py"

      # Verify that multiline targets forwards every line independently.
      - bandit/execute:
          exit-zero: true
          format: json
          output-file: /tmp/bandit-multiline-targets.json
          recursive: false
          targets: |
            tests/clean/main.py
            tests/insecure/main.py

      - run:
          name: Verify multiline targets
          command: |
            set -euo pipefail

            test -s /tmp/bandit-multiline-targets.json

            python - \<<'PY'
            import json
            from pathlib import Path

            report_path = Path(
                "/tmp/bandit-multiline-targets.json"
            )
            report = json.loads(
                report_path.read_text(encoding="utf-8")
            )

            errors = report.get("errors", [])
            if errors:
                raise SystemExit(
                    f"Bandit reported scan errors: {errors}"
                )

            metrics = report.get("metrics", {})
            scanned_files = {
                Path(filename).as_posix()
                for filename in metrics
                if filename != "_totals"
            }

            expected_files = {
                "tests/clean/main.py",
                "tests/insecure/main.py",
            }

            missing_files = {
                expected
                for expected in expected_files
                if not any(
                    filename.endswith(expected)
                    for filename in scanned_files
                )
            }

            if missing_files:
                raise SystemExit(
                    "Multiline targets were not all scanned. "
                    f"Missing: {sorted(missing_files)}; "
                    f"scanned: {sorted(scanned_files)}"
                )

            test_ids = {
                result.get("test_id")
                for result in report.get("results", [])
                if result.get("test_id")
            }

            if "B324" not in test_ids:
                raise SystemExit(
                    "Expected B324 from the second multiline target, "
                    f"but detected: {sorted(test_ids)}"
                )

            print(
                "Verified multiline targets: "
                f"{sorted(expected_files)}"
            )
            PY

      # Prepare two paths that distinguish a literal target from shell glob
      # expansion. literal[1].py is clean, while literal1.py contains B324.
      - run:
          name: Prepare literal glob target fixtures
          command: |
            set -euo pipefail

            rm -rf /tmp/bandit-word-splitting
            mkdir -p /tmp/bandit-word-splitting

            cp \
              tests/clean/main.py \
              '/tmp/bandit-word-splitting/literal[1].py'

            cp \
              tests/insecure/main.py \
              /tmp/bandit-word-splitting/literal1.py

      # Verify that a glob-like target is passed literally.
      # If the shell expands [1], literal1.py is scanned and B324 fails the
      # step. The intended target literal[1].py is clean.
      - bandit/execute:
          recursive: false
          severity-level: high
          targets: "/tmp/bandit-word-splitting/literal[1].py"

      # Verify that tests limits Bandit to the selected test IDs.
      # Only B101 is selected, and it is below the HIGH severity threshold.
      - bandit/execute:
          recursive: false
          severity-level: high
          targets: tests/insecure/main.py
          tests: B101

      # Verify directory scanning and excluded-paths independently.
      - bandit/execute:
          excluded-paths: tests/insecure
          targets: tests

  install-tests:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout

      - bandit/install:
          extras: toml
          version: "1.9.4"

      - bandit/execute:
          recursive: false
          targets: tests/clean/main.py

  resource-class-test:
    executor:
      name: bandit/default
      resource_class: medium
    steps:
      - checkout

      - bandit/install:
          extras: toml
          version: "1.9.4"

      - bandit/execute:
          recursive: false
          targets: tests/clean/main.py

workflows:
  test-deploy:
    jobs:
      - command-tests:
          filters: *filters

      - parameter-tests:
          filters: *filters

      - install-tests:
          filters: *filters

      - resource-class-test:
          filters: *filters

      - orb-tools/pack:
          filters: *filters

      - orb-tools/publish:
          orb-name: orbss/bandit
          vcs-type: << pipeline.project.type >>
          pub-type: production
          requires:
            - orb-tools/pack
            - command-tests
            - install-tests
            - parameter-tests
            - resource-class-test
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
